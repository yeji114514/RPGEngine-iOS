name: Release IPA

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project RPGEngine.xcodeproj -scheme RPGEngine -sdk iphoneos \
            -configuration Release -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/RPGEngine.app" -print -quit)
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload RPGEngine-iOS-v0.5.1-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: RPGEngine-iOS-v0.5.1
          path: RPGEngine-iOS-v0.5.1-unsigned.ipa
